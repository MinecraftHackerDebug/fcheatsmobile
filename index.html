<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FCheats Pro</title>
    <style>
        :root {
            --bg-dark: #0a0a12;
            --card-bg: #1c1c2e;
            --accent-gold: #ffd700;
            --accent-blue: #00d2ff;
            --accent-purple: #9d00ff;
            --text-main: #ffffff;
            --text-sub: #8b8b9e;
            --rank-color: #ff9900; /* Orange/Gold for Rank */
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-y: auto;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 20px;
            background: linear-gradient(90deg, var(--accent-gold), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            letter-spacing: 1px;
        }

        /* UID Section */
        .uid-section {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .uid-input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.3);
            border: 1px solid #333;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            outline: none;
            box-sizing: border-box; /* Fix padding issue */
        }

        input:focus {
            border-color: var(--accent-blue);
        }

        /* Grid for Items */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 12px;
            color: var(--text-sub);
            font-weight: 600;
            text-transform: uppercase;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            color: white;
            font-size: 14px;
        }

        button:active {
            transform: scale(0.98);
        }

        /* Specific Colors */
        .btn-coin { background: linear-gradient(135deg, #ffd700, #ff8c00); color: black; }
        .btn-gem { background: linear-gradient(135deg, #00d2ff, #007bff); }
        .btn-point { background: linear-gradient(135deg, #9d00ff, #6a00ff); }
        .btn-shard { background: linear-gradient(135deg, #ff4b4b, #ff0000); }
        .btn-voucher { background: linear-gradient(135deg, #00ff88, #00b359); color: black; }
        .btn-stellar { background: linear-gradient(135deg, #ff00cc, #333399); }
        
        /* NEW: Rank Up Points Color */
        .btn-rank { 
            background: linear-gradient(135deg, #ff9900, #cc7a00); 
            color: black; 
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* Auto Injector */
        .injector-panel {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--accent-blue);
            border-radius: 12px;
            padding: 15px;
            margin-top: 20px;
        }

        .injector-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }

        .toggle-switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: var(--accent-blue); }
        input:checked + .slider:before { transform: translateX(26px); }

        .status-log {
            font-family: monospace;
            font-size: 11px;
            color: var(--accent-blue);
            height: 60px;
            overflow-y: hidden;
            margin-top: 10px;
            opacity: 0.8;
        }

        .success-msg { color: #00ff88; }
        .error-msg { color: #ff4b4b; }
        
        /* Loader */
        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid var(--accent-blue);
            border-radius: 50%;
            width: 12px;
            height: 12px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-left: 5px;
            display: none;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

<div class="container">
    <h1>FCheats Pro</h1>

    <!-- UID Input -->
    <div class="uid-section">
        <label style="display:block; margin-bottom:8px;">Target Account UID</label>
        <div class="uid-input-group">
            <input type="text" id="uidInput" placeholder="Enter your FC Mobile UID">
        </div>
        <div id="uidStatus" style="font-size:12px; margin-top:5px; color:#888;"></div>
    </div>

    <!-- Manual Inputs -->
    <div class="grid">
        <!-- Coins -->
        <div class="card">
            <label>Coin Amount</label>
            <input type="number" id="coinAmount" placeholder="e.g. 1000000">
            <button class="btn-coin" onclick="manualInject('coins')">Get Coins</button>
            <div id="statusCoin" class="status-log"></div>
        </div>

        <!-- Gems -->
        <div class="card">
            <label>Gem Amount</label>
            <input type="number" id="gemAmount" placeholder="e.g. 5000">
            <button class="btn-gem" onclick="manualInject('gems')">Get Gems</button>
            <div id="statusGem" class="status-log"></div>
        </div>

        <!-- Points -->
        <div class="card">
            <label>Point Amount</label>
            <input type="number" id="pointAmount" placeholder="e.g. 10000">
            <button class="btn-point" onclick="manualInject('points')">Get Points</button>
            <div id="statusPoint" class="status-log"></div>
        </div>

        <!-- Star Shards -->
        <div class="card">
            <label>Star Shards</label>
            <input type="number" id="shardAmount" placeholder="e.g. 500">
            <button class="btn-shard" onclick="manualInject('shards')">Get Shards</button>
            <div id="statusShard" class="status-log"></div>
        </div>

        <!-- Draft Vouchers -->
        <div class="card">
            <label>Draft Vouchers</label>
            <input type="number" id="voucherAmount" placeholder="e.g. 100">
            <button class="btn-voucher" onclick="manualInject('vouchers')">Get Vouchers</button>
            <div id="statusVoucher" class="status-log"></div>
        </div>

        <!-- Stellar Draft -->
        <div class="card">
            <label>Stellar Draft</label>
            <input type="number" id="stellarAmount" placeholder="e.g. 10">
            <button class="btn-stellar" onclick="manualInject('stellar')">Get Stellar</button>
            <div id="statusStellar" class="status-log"></div>
        </div>

        <!-- Rank Up Points (NEW) -->
        <div class="card">
            <label>Rank Up Points</label>
            <input type="number" id="rankAmount" placeholder="e.g. 5000">
            <button class="btn-rank" onclick="manualInject('rank')">Get Rank Pts</button>
            <div id="statusRank" class="status-log"></div>
        </div>
    </div>

    <!-- Auto Injector -->
    <div class="injector-panel">
        <div class="injector-header">
            <span style="font-weight:bold; color:var(--accent-blue);">⚡ Safe Mode Injector</span>
            <label class="toggle-switch">
                <input type="checkbox" id="autoToggle" onchange="toggleAutoInjector()">
                <span class="slider"></span>
            </label>
        </div>
        <div style="font-size:12px; color:#aaa; margin-bottom:10px;">
            Injects: 1M Coins, 500 Gems, 100 Points, 5k Rank Pts every 3s.
        </div>
        <div id="autoStatus" class="status-log">Injector: Idle</div>
    </div>
</div>

<script>
    // --- Configuration ---
    const SAFE_DELAY_MS = 1200; 
    
    // State
    let uidValid = false;
    let autoInterval = null;

    // --- Core Functions ---

    function validateUID() {
        const uid = document.getElementById('uidInput').value.trim();
        const statusEl = document.getElementById('uidStatus');
        
        if (uid.length > 5 && uid.match(/^\d+$/)) {
            uidValid = true;
            statusEl.textContent = "UID Verified ✅";
            statusEl.style.color = "#00ff88";
            return true;
        } else {
            uidValid = false;
            statusEl.textContent = "Invalid UID format ❌";
            statusEl.style.color = "#ff4b4b";
            return false;
        }
    }

    // Listen for UID changes
    document.getElementById('uidInput').addEventListener('input', validateUID);

    // Simulate Server Request
    async function sendToServer(type, amount) {
        if (!validateUID()) {
            logStatus(`status${type.charAt(0).toUpperCase() + type.slice(1)}`, "Enter valid UID first!", "error");
            return;
        }

        const uid = document.getElementById('uidInput').value;
        const statusEl = document.getElementById(`status${type.charAt(0).toUpperCase() + type.slice(1)}`);
        
        // Show loading
        statusEl.innerHTML = 'Connecting... <span class="loader" style="display:inline-block"></span>';
        
        await new Promise(r => setTimeout(r, SAFE_DELAY_MS));
        
        // Success simulation
        statusEl.innerHTML = `Success! Added ${formatNumber(amount)} to UID ${uid}`;
        statusEl.className = 'status-log success-msg';
        
        // Reset after 3 seconds
        setTimeout(() => {
            statusEl.textContent = '';
            statusEl.className = 'status-log';
        }, 3000);
    }

    // Helper: Format numbers with commas
    function formatNumber(num) {
        return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    }

    // Helper: Log status
    function logStatus(elementId, message, type) {
        const el = document.getElementById(elementId);
        el.textContent = message;
        el.className = `status-log ${type}-msg`;
    }

    // Main Injection Function
    function manualInject(type) {
        const amountInput = document.getElementById(`${type}Amount`);
        const amount = parseInt(amountInput.value);
        
        if (!amount || amount <= 0) {
            logStatus(`status${type.charAt(0).toUpperCase() + type.slice(1)}`, "Enter a valid amount.", "error");
            return;
        }

        sendToServer(type, amount);
    }

    // Auto Injector Logic
    function toggleAutoInjector() {
        const checkbox = document.getElementById('autoToggle');
        const statusEl = document.getElementById('autoStatus');
        
        if (checkbox.checked) {
            statusEl.textContent = "Injector: Running...";
            statusEl.style.color = "#00ff88";
            
            autoInterval = setInterval(() => {
                if(!validateUID()) {
                    statusEl.textContent = "Injector: Waiting for UID...";
                    statusEl.style.color = "#ff9900";
                    return;
                }
                
                // Send small batches automatically
                manualInject('coins');
                setTimeout(() => manualInject('gems'), 500);
                setTimeout(() => manualInject('points'), 1000);
                setTimeout(() => manualInject('rank'), 1500); // Added Rank to auto
                
            }, 3000);
        } else {
            clearInterval(autoInterval);
            statusEl.textContent = "Injector: Stopped";
            statusEl.style.color = "#aaa";
        }
    }
</script>

</body>
</html>
